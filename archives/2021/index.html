<script>
  window.addEventListener('tabs:register', () => {
    let { activeClass } = CONFIG.comments;
    if (CONFIG.comments.storage) {
      activeClass = localStorage.getItem('comments_active') || activeClass;
    }
    if (activeClass) {
      let activeTab = document.querySelector(`a[href="#comment-${activeClass}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }
  });
  if (CONFIG.comments.storage) {
    window.addEventListener('tabs:click', event => {
      if (!event.target.matches('.tabs-comment .tab-content .tab-pane')) return;
      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>

<!-- 2. 全局吸底播放器挂载 (左下角常驻悬浮小唱片) -->
<!-- 歌单：一步天涯四海为家喜欢的音乐 (ID: 128691730) -->
<meting-js
  server="netease"
  type="playlist"
  id="128691730"
  fixed="true"
  mini="true"
  autoplay="false"
  theme="#fc6423"
  loop="all"
  order="list"
  preload="auto"
  volume="0.6"
  mutex="true"
  list-folded="true">
</meting-js>

<!-- 3. 前端交互增强脚本 (解决搜索框遮挡 & 默认收起歌词) -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // A. 将搜索弹窗节点提升至 <body> 最顶层，彻底解除侧边栏半透明度与 240px 宽度的层级限制
  var searchOverlay = document.querySelector('.search-pop-overlay');
  if (searchOverlay && searchOverlay.parentNode !== document.body) {
    document.body.appendChild(searchOverlay);
  }

  // B. 默认关闭 APlayer 全站歌词悬浮条 (访客点击播放器上的歌词图标仍可随时开启)
  var lrcTimer = setInterval(function() {
    var meting = document.querySelector('meting-js');
    if (meting && meting.aplayer && meting.aplayer.lrc) {
      meting.aplayer.lrc.hide();
      clearInterval(lrcTimer);
    }
  }, 200);
  setTimeout(function() { clearInterval(lrcTimer); }, 6000);
});
</script>
