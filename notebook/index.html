      location.reload();
    }

    function injectRelockUI() {
      var container = document.querySelector('#hexo-blog-encrypt.hbe-decrypted-content');
      if (!container) return;

      // 1. 顶部解密状态与快捷上锁栏
      if (!container.querySelector('.hbe-unlocked-banner')) {
        var topBanner = document.createElement('div');
        topBanner.className = 'hbe-unlocked-banner';
        topBanner.innerHTML = '<span class="hbe-unlocked-info"><i class="fa fa-unlock-alt"></i> <span>已解锁私密保护内容</span></span>' +
                              '<button type="button" class="hbe-relock-btn" title="清除本地凭证并重新锁定本页"><i class="fa fa-lock"></i> 重新上锁</button>';
        topBanner.querySelector('.hbe-relock-btn').addEventListener('click', relockCurrentPage);
        container.insertBefore(topBanner, container.firstChild);
      }

      // 2. 底部重新上锁操作卡片
      if (!container.querySelector('.hbe-relock-footer')) {
        var footer = document.createElement('div');
        footer.className = 'hbe-relock-footer';
        footer.innerHTML = '<button type="button" class="hbe-relock-btn hbe-relock-btn-primary" title="清除本地解密凭证"><i class="fa fa-lock"></i> 重新锁定此页</button>' +
                           '<div class="hbe-relock-tip"><i class="fa fa-info-circle"></i> <span>已开启免密访问。离开设备或公用电脑使用完毕后，点击可立即恢复锁定。</span></div>';
        footer.querySelector('.hbe-relock-btn').addEventListener('click', relockCurrentPage);
        container.appendChild(footer);
      }
    }

    function checkCopyrightVisibility() {
      var hbe = document.getElementById('hexo-blog-encrypt');
      var cp = document.querySelector('.post-copyright');
      if (hbe && cp) {
        if (!hbe.classList.contains('hbe-decrypted-content')) {
          cp.style.display = 'none';
        } else {
          cp.style.display = '';
        }
      }
    }

    // 监听解密成功事件
    window.addEventListener('hexo-blog-decrypt', function() {
      setTimeout(function() {
        injectRelockUI();
        checkCopyrightVisibility();
      }, 50);
    });

    // 若此前已 autoSave 自动解密，DOM ready 时检测并补齐 UI
    function initGuard() {
      checkCopyrightVisibility();
      injectRelockUI();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initGuard, 200);
      });
    } else {
      setTimeout(initGuard, 200);
    }
  })();
  </script>

  <script>
  (function() {
    function initTwikoo() {
      var el = document.querySelector('#tcomment');

      // 隐私安全联动：若当前文章处于加密锁定状态，隐藏评论区直至输入密码解密成功
      var encryptContainer = document.querySelector('#hexo-blog-encrypt.hbe-container');
      var commentContainer = document.querySelector('.comments');
      if (encryptContainer && commentContainer) {
        commentContainer.style.display = 'none';
        window.addEventListener('hexo-blog-decrypt', function() {
          commentContainer.style.display = '';
        });
      }

      if (el) {
        if (!'https://twikoo-vercel2.vercel.app') {
          el.innerHTML = '<div style="text-align:center;padding:28px 16px;color:#888;font-size:14px;border:1px dashed rgba(0,0,0,0.15);border-radius:8px;"><i class="fa fa-info-circle" style="color:#fc6423;margin-right:6px;"></i> <strong>Twikoo 评论系统已就绪</strong><br><span style="font-size:12px;display:inline-block;margin-top:6px;color:#999;">请在 <code>source/_data/next.yml</code> 中配置 <code>twikoo.envId</code> 云端服务地址即可启用。详见 <a href="/guestbook/" style="color:#fc6423;text-decoration:underline;">留言板与配置指南</a>。</span></div>';
        } else {
          var retryCount = 0;
          function tryInit() {
            if (typeof twikoo !== 'undefined') {
              twikoo.init({
                envId: 'https://twikoo-vercel2.vercel.app',
                el: '#tcomment',
                
                path: location.pathname,
                lang: 'zh-CN'
              });
            } else if (retryCount < 25) {
              retryCount++;
              setTimeout(tryInit, 200);
            }
          }
          tryInit();
        }
      }

      // 智能识别并绑定文章链接 (支持首页卡片列表与文章详情页)
      var countLinks = document.querySelectorAll('.post-comments-count-link');
      if (countLinks.length > 0) {
        var urls = [];
        countLinks.forEach(function(link) {
          var article = link.closest('article');
          var countSpan = link.querySelector('.twikoo-comment-count');
          var postPath = '';
          if (article) {
            var titleLink = article.querySelector('.post-title-link');
            if (titleLink) {
              var href = titleLink.getAttribute('href');
              link.href = href + '#tcomment';
              postPath = href;
            }
          }
          if (!postPath) {
            postPath = location.pathname;
          }
          if (countSpan) {
            countSpan.setAttribute('data-path', postPath);
          }
          if (postPath && urls.indexOf(postPath) === -1) {
            urls.push(postPath);
          }
        });

        // 若已配置 envId，批量拉取各文章的评论数量
        if ('https://twikoo-vercel2.vercel.app' && urls.length > 0) {
          var countRetry = 0;
          function tryFetchCounts() {
            if (typeof twikoo !== 'undefined') {
              twikoo.getCommentsCount({
                envId: 'https://twikoo-vercel2.vercel.app',
                urls: urls,
                includeReply: false
              }).then(function(res) {
                if (res && res.length) {
                  var countSpans = document.querySelectorAll('.twikoo-comment-count');
                  countSpans.forEach(function(span) {
                    var p = span.getAttribute('data-path');
                    for (var i = 0; i < res.length; i++) {
                      if (res[i].url === p) {
                        span.innerText = res[i].count;
                        break;
                      }
                    }
                  });
                }
              }).catch(function() {});
            } else if (countRetry < 25) {
              countRetry++;
              setTimeout(tryFetchCounts, 200);
            }
          }
          tryFetchCounts();
        }
      }
    }

    if (document.querySelector('#tcomment') || document.querySelector('.twikoo-comment-count')) {
      if (typeof NexT !== 'undefined' && NexT.utils && NexT.utils.loadComments && document.querySelector('#tcomment')) {
        NexT.utils.loadComments(document.querySelector('#tcomment'), initTwikoo);
      } else {
        initTwikoo();
      }
    }

    document.addEventListener('pjax:success', function() {
      if (document.querySelector('#tcomment') || document.querySelector('.twikoo-comment-count')) {
        initTwikoo();
      }
    });
  })();
  </script>

<!-- 4. 手动深色 / 浅色模式一键切换悬浮球 -->
<div id="theme-toggle-btn" class="theme-toggle-btn" title="切换深色/浅色护眼模式" aria-label="切换深色/浅色护眼模式">
  <i class="theme-icon fa fa-sun"></i>
</div>

<script>
(function() {
  function updateThemeButton() {
    var btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    var icon = btn.querySelector('.theme-icon');
    var isDark = document.documentElement.classList.contains('dark-mode');
    if (isDark) {
      icon.className = 'theme-icon fa fa-moon';
      btn.setAttribute('title', '切换为明亮护眼模式');
    } else {
      icon.className = 'theme-icon fa fa-sun';
      btn.setAttribute('title', '切换为暗黑极客模式');
    }
  }

  function toggleTheme() {
    var isDark = document.documentElement.classList.contains('dark-mode');
    if (isDark) {
      document.documentElement.classList.remove('dark-mode');
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.classList.add('dark-mode');
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
    updateThemeButton();
    reloadMermaid();
  }

  // 5. Mermaid 架构图深浅主题自适应与动态重绘引擎
  function reloadMermaid() {
    if (!window.mermaid) return;
    var isDark = document.documentElement.classList.contains('dark-mode');
    var theme = isDark ? 'dark' : 'default';
    var nodes = document.querySelectorAll('.mermaid[data-mermaid-code]');
    if (!nodes.length) return;

    try {
      mermaid.initialize({
        theme: theme,
        startOnLoad: false,
        flowchart: { curve: 'linear' },
        gantt: { axisFormat: '%m/%d/%Y' },
        sequence: { actorMargin: 50 }
      });

      nodes.forEach(function(el, i) {
        var raw = el.getAttribute('data-mermaid-code');
        if (!raw) return;
        var renderId = 'mermaid-render-' + i + '-' + Date.now();
        mermaid.render(renderId, raw, function(svgGraph) {
          el.innerHTML = svgGraph;
        });
      });
    } catch (e) {
      console.warn('Mermaid reload error:', e);
    }
  }

  // 拦截 Mermaid 初始化配置，确保首次加载时使用正确的深色/浅色主题
  try {
    var _rawMermaid = window.mermaid;
    Object.defineProperty(window, 'mermaid', {
      configurable: true,
      set: function(val) {
        this._mermaid_instance = val;
        if (val && typeof val.initialize === 'function') {
          var origInit = val.initialize;
          val.initialize = function(options) {
            options = options || {};
            var isDark = document.documentElement.classList.contains('dark-mode');
            options.theme = isDark ? 'dark' : (options.theme || 'default');
            return origInit.call(val, options);
          };
        }
      },
      get: function() {
        return this._mermaid_instance;
      }
    });
    if (_rawMermaid) window.mermaid = _rawMermaid;
  } catch (e) {
    // 降级兼容
  }

  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.addEventListener('click', toggleTheme);
      updateThemeButton();
    }
  });

  // 支持 PJAX 页面切换保持按钮状态与图表校验
  window.addEventListener('pjax:success', function() {
    updateThemeButton();
    reloadMermaid();
  });

  // 监听操作系统深色/浅色偏好变动 (仅在用户未手动锁定时自适应)
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme')) {
        if (e.matches) {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark-mode');
          document.documentElement.setAttribute('data-theme', 'light');
        }
        updateThemeButton();
        reloadMermaid();
      }
    });
  }
})();
</script>

<!-- 6. Mac 拟态代码块增强：语言徽章与超长代码智能折叠 (v2.7.0) -->
<script>
(function() {
  function initMacCodeblocks() {
    var figures = document.querySelectorAll('figure.highlight');
    if (!figures.length) return;

    figures.forEach(function(fig) {
      var container = fig.closest('.highlight-container') || fig;
      if (container.dataset.macEnhanced) return;
      container.dataset.macEnhanced = 'true';

      // 1. 提取并注入语言徽章 (Language Badge)
      if (!container.querySelector('.code-lang-badge')) {
        var classes = Array.prototype.slice.call(fig.classList);
        var langClass = classes.find(function(c) {
          return c !== 'highlight' && c !== 'table-container' && c.trim() !== '';
        });
        var langText = 'CODE';
        if (langClass) {
          var map = {
            'js': 'JAVASCRIPT',
            'javascript': 'JAVASCRIPT',
            'ts': 'TYPESCRIPT',
            'typescript': 'TYPESCRIPT',
            'c': 'C',
            'cpp': 'C++',
            'cc': 'C++',
            'cxx': 'C++',
            'h': 'C/C++ HEADER',
            'hpp': 'C++ HEADER',
            'py': 'PYTHON',
            'python': 'PYTHON',
            'sh': 'BASH',
            'bash': 'BASH',
            'zsh': 'ZSH',
            'shell': 'SHELL',
            'html': 'HTML',
            'css': 'CSS',
            'styl': 'STYLUS',
            'stylus': 'STYLUS',
            'yml': 'YAML',
            'yaml': 'YAML',
            'json': 'JSON',
            'xml': 'XML',
            'sql': 'SQL',
            'glsl': 'GLSL',
            'plaintext': 'TEXT',
            'text': 'TEXT',
            'markdown': 'MARKDOWN',
            'md': 'MARKDOWN'
          };
          langText = map[langClass.toLowerCase()] || langClass.toUpperCase();
        }

        var badge = document.createElement('span');
        badge.className = 'code-lang-badge';
        badge.textContent = langText;
        container.appendChild(badge);
      }

      // 2. 超长代码块智能折叠 (> 30 行或内容高度 > 360px)
      var lines = fig.querySelectorAll('.gutter .line').length ||
                  fig.querySelectorAll('.code .line').length;

      var isLong = lines >= 30;
      if (!isLong && fig.offsetHeight > 360) {
        isLong = true;
      }

      if (isLong && !container.classList.contains('code-collapsed') && !container.classList.contains('code-expanded')) {
        container.classList.add('code-collapsed');

        var mask = document.createElement('div');
        mask.className = 'code-fold-mask';
        container.appendChild(mask);

        var btnWrap = document.createElement('div');
        btnWrap.className = 'code-fold-btn-wrap';

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'code-fold-btn';
        btn.setAttribute('aria-label', '展开全部代码');
        var lineLabel = lines > 0 ? ' (' + lines + ' 行)' : '';
        btn.innerHTML = '<i class="fa fa-angle-down"></i> <span>展开全部代码' + lineLabel + '</span>';

        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var isCollapsed = container.classList.contains('code-collapsed');
          if (isCollapsed) {
            container.classList.remove('code-collapsed');
            container.classList.add('code-expanded');
            btn.innerHTML = '<i class="fa fa-angle-up"></i> <span>收起代码</span>';
          } else {
            container.classList.remove('code-expanded');
            container.classList.add('code-collapsed');
            btn.innerHTML = '<i class="fa fa-angle-down"></i> <span>展开全部代码' + lineLabel + '</span>';

            // 智能视口回滚：若代码块顶部已被滚出屏幕上方，则平滑滚回代码块起始位置
            var rect = container.getBoundingClientRect();
            if (rect.top < 60) {
              window.scrollTo({
                top: window.scrollY + rect.top - 80,
                behavior: 'smooth'
              });
            }
          }
        });

        btnWrap.appendChild(btn);
        container.appendChild(btnWrap);
      }
    });
  }

  // 挂载执行：DOM 就绪与 PJAX 路由切换
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(initMacCodeblocks, 60);
    });
  } else {
    setTimeout(initMacCodeblocks, 60);
  }
  window.addEventListener('pjax:success', function() {
    setTimeout(initMacCodeblocks, 60);
  });
})();
</script>
