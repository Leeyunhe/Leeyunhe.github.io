        });

        // 若已配置 envId，批量拉取各文章的评论数量
        if (typeof twikoo !== 'undefined' && 'https://twikoo-vercel2.vercel.app' && urls.length > 0) {
          twikoo.getCommentsCount({
            envId: 'https://twikoo-vercel2.vercel.app',
            urls: urls,
            includeReply: false
          }).then(function(res) {
            if (res && res.length) {
              var countSpans = document.querySelectorAll('.twikoo-comment-count');
              countSpans.forEach(function(span) {
                var p = span.getAttribute('data-path');
                for (var i = 0; i < res.length; i++) {
                  if (res[i].url === p) {
                    span.innerText = res[i].count;
                    break;
                  }
                }
              });
            }
          }).catch(function() {});
        }
      }
    }

    if (document.querySelector('#tcomment') || document.querySelector('.twikoo-comment-count')) {
      if (typeof NexT !== 'undefined' && NexT.utils && NexT.utils.loadComments && document.querySelector('#tcomment')) {
        NexT.utils.loadComments(document.querySelector('#tcomment'), initTwikoo);
      } else {
        initTwikoo();
      }
    }

    document.addEventListener('pjax:success', function() {
      if (document.querySelector('#tcomment') || document.querySelector('.twikoo-comment-count')) {
        initTwikoo();
      }
    });
  })();
  </script>
  
  <script>
  (function() {
    function relockCurrentPage() {
      var currentPath = location.pathname;
      var targetKey = 'hbe.v4.' + currentPath + location.search;
      localStorage.removeItem(targetKey);
      localStorage.removeItem('hbe.v4.' + currentPath);
      localStorage.removeItem('hbe.v4.' + currentPath.replace(/\/+$/, ''));
      localStorage.removeItem('hbe.v4.' + currentPath + '/');
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf('hbe.v4.') === 0) {
          if (k.indexOf(currentPath) !== -1 || k.indexOf(encodeURI(currentPath)) !== -1 || k.indexOf(decodeURI(currentPath)) !== -1) {
            localStorage.removeItem(k);
          }
        }
      }
      location.reload();
    }

    function injectRelockUI() {
      var container = document.querySelector('#hexo-blog-encrypt.hbe-decrypted-content');
      if (!container) return;

      // 1. 顶部解密状态与快捷上锁栏
      if (!container.querySelector('.hbe-unlocked-banner')) {
        var topBanner = document.createElement('div');
        topBanner.className = 'hbe-unlocked-banner';
        topBanner.innerHTML = '<span class="hbe-unlocked-info"><i class="fa fa-unlock-alt"></i> <span>已解锁私密保护内容</span></span>' +
                              '<button type="button" class="hbe-relock-btn" title="清除本地凭证并重新锁定本页"><i class="fa fa-lock"></i> 重新上锁</button>';
        topBanner.querySelector('.hbe-relock-btn').addEventListener('click', relockCurrentPage);
        container.insertBefore(topBanner, container.firstChild);
      }

      // 2. 底部重新上锁操作卡片
      if (!container.querySelector('.hbe-relock-footer')) {
        var footer = document.createElement('div');
        footer.className = 'hbe-relock-footer';
        footer.innerHTML = '<button type="button" class="hbe-relock-btn hbe-relock-btn-primary" title="清除本地解密凭证"><i class="fa fa-lock"></i> 重新锁定此页</button>' +
                           '<div class="hbe-relock-tip"><i class="fa fa-info-circle"></i> <span>已开启免密访问。离开设备或公用电脑使用完毕后，点击可立即恢复锁定。</span></div>';
        footer.querySelector('.hbe-relock-btn').addEventListener('click', relockCurrentPage);
        container.appendChild(footer);
      }
    }

    // 监听解密成功事件
    window.addEventListener('hexo-blog-decrypt', function() {
      setTimeout(injectRelockUI, 50);
    });

    // 若此前已 autoSave 自动解密，DOM ready 时检测并补齐 UI
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(injectRelockUI, 200);
      });
    } else {
      setTimeout(injectRelockUI, 200);
    }
  })();
  </script>
