<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Miku Teal Gradient for Hair -->
    <linearGradient id="mikuHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4de3d7"/>
      <stop offset="60%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#249d94"/>
    </linearGradient>
    <!-- Twintail Shading -->
    <linearGradient id="mikuTailL" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4de3d7"/>
      <stop offset="70%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#1b857d"/>
    </linearGradient>
    <linearGradient id="mikuTailR" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4de3d7"/>
      <stop offset="70%" stop-color="#39c5bb"/>
      <stop offset="100%" stop-color="#1b857d"/>
    </linearGradient>
    <!-- Soft shadow filter -->
    <filter id="mikuDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#mikuDrop)">
    <!-- 1. Left Twintail (flowing back & down) -->
    <path d="M 20 22 C 14 18, 4 24, 2 35 C 0 44, 6 52, 10 56 C 11 57, 12 55, 11 53 C 7 47, 6 38, 12 31 C 15 27, 18 26, 20 24 Z" 
          fill="url(#mikuTailL)" stroke="#1d867e" stroke-width="0.6"/>
    <!-- Left Twintail inner highlight strand -->
    <path d="M 18 23 C 12 21, 5 28, 4 36 C 3 43, 7 49, 10 53" 
          fill="none" stroke="#7ef5ec" stroke-width="0.8" opacity="0.75" stroke-linecap="round"/>

    <!-- 2. Right Twintail (flowing back & down) -->
    <path d="M 44 22 C 50 18, 60 24, 62 35 C 64 44, 58 52, 54 56 C 53 57, 52 55, 53 53 C 57 47, 58 38, 52 31 C 49 27, 46 26, 44 24 Z" 
          fill="url(#mikuTailR)" stroke="#1d867e" stroke-width="0.6"/>
    <!-- Right Twintail inner highlight strand -->
    <path d="M 46 23 C 52 21, 59 28, 60 36 C 61 43, 57 49, 54 53" 
          fill="none" stroke="#7ef5ec" stroke-width="0.8" opacity="0.75" stroke-linecap="round"/>

    <!-- 3. Twin-tail Square Ribbons (Iconic Black + Magenta Border) -->
    <!-- Left Ribbon -->
    <rect x="16.5" y="19" width="4.5" height="5.5" rx="1" fill="#1e293b" stroke="#ff2d75" stroke-width="1"/>
    <!-- Right Ribbon -->
    <rect x="43" y="19" width="4.5" height="5.5" rx="1" fill="#1e293b" stroke="#ff2d75" stroke-width="1"/>

    <!-- 4. Back Hair -->
    <ellipse cx="32" cy="27" rx="15" ry="14" fill="#2aa399"/>

    <!-- 5. Headset Arch -->
    <path d="M 16 26 A 16 16 0 0 1 48 26" stroke="#334155" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- 6. Face Base -->
    <path d="M 17 26 C 17 37, 24 40, 32 40 C 40 40, 47 37, 47 26 C 47 18, 40 15, 32 15 C 24 15, 17 18, 17 26 Z" 
          fill="#fff1e8"/>

    <!-- 7. Headset Ear-cups -->
    <rect x="14.5" y="24" width="3.2" height="6.5" rx="1.6" fill="#1e293b"/>
    <line x1="16.1" y1="25.5" x2="16.1" y2="29" stroke="#ff2d75" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="46.3" y="24" width="3.2" height="6.5" rx="1.6" fill="#1e293b"/>
    <line x1="47.9" y1="25.5" x2="47.9" y2="29" stroke="#ff2d75" stroke-width="1.2" stroke-linecap="round"/>

    <!-- 8. Cheek Blush -->
    <ellipse cx="22.5" cy="32" rx="2.8" ry="1.4" fill="#ff758f" opacity="0.6"/>
    <ellipse cx="41.5" cy="32" rx="2.8" ry="1.4" fill="#ff758f" opacity="0.6"/>

    <!-- 9. Eyes (Big Anime Chibi Eyes) -->
    <!-- Left Eye -->
    <ellipse cx="25" cy="28.5" rx="3.5" ry="4.5" fill="#1e293b"/>
    <ellipse cx="25" cy="29.2" rx="3" ry="3.8" fill="#00bfa5"/>
    <ellipse cx="25" cy="30.2" rx="2" ry="2.5" fill="#004d40"/>
    <!-- Catchlights -->
    <circle cx="23.8" cy="26.8" r="1.3" fill="#ffffff"/>
    <circle cx="26.3" cy="30.8" r="0.7" fill="#ffffff"/>
    <!-- Eyelash -->
    <path d="M 21.5 26.5 Q 25 23.5 28.5 26" stroke="#0f172a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Right Eye -->
    <ellipse cx="39" cy="28.5" rx="3.5" ry="4.5" fill="#1e293b"/>
    <ellipse cx="39" cy="29.2" rx="3" ry="3.8" fill="#00bfa5"/>
    <ellipse cx="39" cy="30.2" rx="2" ry="2.5" fill="#004d40"/>
    <!-- Catchlights -->
    <circle cx="37.8" cy="26.8" r="1.3" fill="#ffffff"/>
    <circle cx="40.3" cy="30.8" r="0.7" fill="#ffffff"/>
    <!-- Eyelash -->
    <path d="M 35.5 26 Q 39 23.5 42.5 26.5" stroke="#0f172a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- 10. Cute Chibi Smile -->
    <path d="M 30.5 33.5 Q 32 35.2 33.5 33.5" stroke="#f43f5e" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- 11. Front Hair / Bangs (Layered Miku Bangs) -->
    <path d="M 17 24 C 18 15, 46 15, 47 24 C 44 23, 41 24.5, 39.5 22.5 C 38 25.5, 34.5 26.5, 33 23 C 31 26, 27.5 25.5, 26 22.5 C 24 25, 20 23.5, 17 24 Z" 
          fill="url(#mikuHair)"/>
    <!-- Hair Shimmer Highlight -->
    <path d="M 23 18 Q 32 16 41 18" stroke="#a7f3d0" stroke-width="1.5" fill="none" opacity="0.65" stroke-linecap="round"/>

    <!-- 12. Torso & Clothes (Running posture) -->
    <!-- Gray/Silver Vest -->
    <path d="M 27 39 L 37 39 L 39 49 L 25 49 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
    <!-- Collar -->
    <polygon points="29,39 32,42 35,39" fill="#ffffff"/>
    <!-- Teal Tie (with pink clip) -->
    <polygon points="31,41 33,41 33.8,48 32,50 30.2,48" fill="#39c5bb"/>
    <rect x="31.2" y="42" width="1.6" height="1.2" fill="#ff2d75"/>

    <!-- Black Pleated Skirt with Teal Hem -->
    <path d="M 24 49 L 40 49 L 43 55 L 21 55 Z" fill="#1e293b"/>
    <line x1="21.5" y1="54.2" x2="42.5" y2="54.2" stroke="#39c5bb" stroke-width="1.1"/>

    <!-- 13. Arms / Detached Sleeves (Running Swing) -->
    <!-- Left Arm (swinging back) -->
    <g transform="rotate(28 22 43)">
      <rect x="20" y="39" width="4.8" height="10" rx="2.4" fill="#1e293b"/>
      <line x1="20.2" y1="41" x2="24.6" y2="41" stroke="#39c5bb" stroke-width="1"/>
      <circle cx="22.4" cy="50" r="1.8" fill="#fff1e8"/>
    </g>
    <!-- Right Arm (swinging forward) -->
    <g transform="rotate(-30 42 43)">
      <rect x="39" y="39" width="4.8" height="10" rx="2.4" fill="#1e293b"/>
      <line x1="39.2" y1="41" x2="43.6" y2="41" stroke="#39c5bb" stroke-width="1"/>
      <circle cx="41.4" cy="50" r="1.8" fill="#fff1e8"/>
    </g>

    <!-- 14. Legs / Boots (Running strides) -->
    <!-- Left Leg (back stride) -->
    <g transform="rotate(20 26 55)">
      <rect x="24.5" y="53" width="4.2" height="7" rx="2" fill="#1e293b"/>
      <line x1="24.7" y1="55" x2="28.5" y2="55" stroke="#39c5bb" stroke-width="0.8"/>
      <circle cx="26.6" cy="61" r="2.2" fill="#0f172a"/>
    </g>
    <!-- Right Leg (forward stride) -->
    <g transform="rotate(-22 37 55)">
      <rect x="35" y="53" width="4.2" height="7" rx="2" fill="#1e293b"/>
      <line x1="35.2" y1="55" x2="39" y2="55" stroke="#39c5bb" stroke-width="0.8"/>
      <circle cx="37.1" cy="61" r="2.2" fill="#0f172a"/>
    </g>
  </g>
</svg>
